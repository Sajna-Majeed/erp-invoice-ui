<div class="page-header">
  <h2>Invoices</h2>

  <button mat-raised-button color="primary" (click)="create()">
    + New Invoice
  </button>
</div>

<table mat-table [dataSource]="data" class="mat-elevation-z2 full-width">

  <!-- Invoice Number -->
  <ng-container matColumnDef="invoiceNumber">
    <th mat-header-cell *matHeaderCellDef>Invoice #</th>
    <td mat-cell *matCellDef="let row">
      {{ row.invoice_No }}
    </td>
  </ng-container>

  <!-- Business Partner -->
  <ng-container matColumnDef="partner">
    <th mat-header-cell *matHeaderCellDef>Partner</th>
    <td mat-cell *matCellDef="let row">
      {{ row.partner }}
    </td>
  </ng-container>

  <!-- Invoice Date -->
  <ng-container matColumnDef="invoiceDate">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let row">
      {{ row.invoice_Date | date }}
    </td>
  </ng-container>

  <!-- Due Date -->
  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef>Due Date</th>
    <td mat-cell *matCellDef="let row">
      {{ row.due_Date | date }}
    </td>
  </ng-container>

  <!-- Total -->
  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let row">
      {{ row.total | currency }}
    </td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">
      <span class="status-chip" [ngClass]="row.status">
        {{ row.status }}
      </span>
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row">
      <button mat-icon-button (click)="edit(row)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="view(row)">
        <mat-icon>visibility</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(row.invoice_Id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
