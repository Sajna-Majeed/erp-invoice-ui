<mat-card>

  <h2>Invoice Header</h2>

  <div class="grid-2">

    <mat-form-field appearance="outline">
      <mat-label>Invoice Number</mat-label>
      <input matInput formControlName="invoiceNumber" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Invoice Date</mat-label>
      <input matInput [matDatepicker]="picker"
             formControlName="invoiceDate"
             (dateChange)="calculateDueDate()">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

  </div>

  <h3>From</h3>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Partner</mat-label>
    <mat-select formControlName="fromPartnerId">
      <mat-option *ngFor="let bp of businessPartners" [value]="bp.id">
        {{bp.name}}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div formGroupName="fromBillingAddress" class="grid-3">
    <mat-form-field appearance="outline">
      <input matInput placeholder="Address" formControlName="addressLine1">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <input matInput placeholder="City" formControlName="city">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <input matInput placeholder="Country" formControlName="country">
    </mat-form-field>
  </div>

  <h3>To</h3>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Partner</mat-label>
    <mat-select formControlName="toPartnerId">
      <mat-option *ngFor="let bp of businessPartners" [value]="bp.id">
        {{bp.name}}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-checkbox formControlName="sameAsBilling">
    Shipping same as Billing
  </mat-checkbox>

  <h3>Items</h3>

  <table mat-table [dataSource]="lines.controls">

    <ng-container matColumnDef="item">
      <th mat-header-cell *matHeaderCellDef>Item</th>
      <td mat-cell *matCellDef="let row; let i=index" [formGroup]="row">
        <input matInput formControlName="itemName" (input)="recalculate()">
      </td>
    </ng-container>

    <ng-container matColumnDef="qty">
      <th mat-header-cell *matHeaderCellDef>Qty</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <input matInput type="number"
               formControlName="quantity"
               (input)="recalculate()">
      </td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <input matInput type="number"
               formControlName="unitPrice"
               (input)="recalculate()">
      </td>
    </ng-container>

    <ng-container matColumnDef="tax">
      <th mat-header-cell *matHeaderCellDef>Tax %</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <input matInput type="number"
               formControlName="taxPercent"
               (input)="recalculate()">
      </td>
    </ng-container>

    <ng-container matColumnDef="remove">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row; let i=index">
        <button mat-button color="warn"
                (click)="removeLine(i)">X</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <button mat-raised-button color="primary" (click)="addLine()">
    Add Line
  </button>

  <div class="summary">
    <p>Total: {{invoiceForm.value.totalAmount}}</p>
    <p>Tax: {{invoiceForm.value.totalTax}}</p>
    <h2>Grand Total: {{invoiceForm.value.grandTotal}}</h2>
  </div>

  <button mat-raised-button color="accent" (click)="submit()">
    Save Invoice
  </button>

</mat-card>
