<div class="dashboard-grid">

  <!-- Users -->
  <mat-card class="stat-card users">
    <div class="icon">
      <mat-icon>people</mat-icon>
    </div>
    <div class="details">
      <h3>{{ totalUsers }}</h3>
      <p>Total Users</p>
    </div>
  </mat-card>

  <!-- Pending Requests -->
  <mat-card class="stat-card pending">
    <div class="icon">
      <mat-icon>hourglass_top</mat-icon>
    </div>
    <div class="details">
      <h3>{{ pendingRequests }}</h3>
      <p>Pending Requests</p>
    </div>
  </mat-card>

  <!-- Pending Activations -->
  <mat-card class="stat-card activation">
    <div class="icon">
      <mat-icon>person_add</mat-icon>
    </div>
    <div class="details">
      <h3>{{ pendingActivation }}</h3>
      <p>Pending User Activations</p>
    </div>
  </mat-card>

  <!-- Total Rides -->
  <mat-card class="stat-card rides">
    <div class="icon">
      <mat-icon>directions_car</mat-icon>
    </div>
    <div class="details">
      <h3>{{ rideCount }}</h3>
      <p>Total Rides</p>
    </div>
  </mat-card>

</div>
