<mat-card>

  <div style="display:flex; align-items:center; justify-content:space-between;">
    <h2>Users</h2>

    <button mat-raised-button color="primary"
            routerLink="/dashboard/users/create">
      Create New User
    </button>
  </div>

  <table mat-table [dataSource]="users" class="mat-elevation-z2" style="width:100%; margin-top:15px;">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let u"> {{ u.id }} </td>
    </ng-container>
  <!-- Full Name -->
    <ng-container matColumnDef="fullName">
      <th mat-header-cell *matHeaderCellDef> Full Name </th>
      <td mat-cell *matCellDef="let u"> {{ u.fullName }} </td>
    </ng-container>
  <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let u"> {{ u.email }} </td>
    </ng-container>
  <!-- Mobile Number -->
    <ng-container matColumnDef="mobileNumber">
      <th mat-header-cell *matHeaderCellDef> Mobile Number </th>
      <td mat-cell *matCellDef="let u"> {{ u.mobileNumber }} </td>
    </ng-container>

    <!-- Username -->
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef> Username </th>
      <td mat-cell *matCellDef="let u"> {{ u.username }} </td>
    </ng-container>

    <!-- Role -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let u"> {{ u.role }} </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>

      <td mat-cell *matCellDef="let u">

        <button mat-button color="primary"
                [routerLink]="['/dashboard/users/edit', u.userId]">
          Edit
        </button>

        <button mat-button color="warn"
                (click)="deleteUser(u.userId)">
          Delete
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</mat-card>
