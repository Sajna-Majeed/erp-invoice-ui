<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" *ngIf="!isMobile">

    <div class="sidebar-header">
      <h2 class="logo">ERP Pro</h2>
    </div>

    <p-panelMenu 
      [model]="menuItems"
      styleClass="erp-menu">
    </p-panelMenu>

  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">

      <button 
        *ngIf="isMobile"
        pButton 
        icon="pi pi-bars" 
        text 
        (click)="mobileSidebar = true">
      </button>

      <span class="title">{{ currentRoute }}</span>

      <div class="spacer"></div>

      <!-- Dark Toggle -->
      <button 
        pButton 
        text
        (click)="themeService.toggle()"
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'">
      </button>

      <!-- User Menu -->
      <p-menu #userMenu [popup]="true" [model]="userItems"></p-menu>

      <button 
        pButton 
        text 
        icon="pi pi-user"
        (click)="userMenu.toggle($event)">
      </button>

    </header>

    <!-- Content -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>

<!-- Mobile Drawer -->
<p-drawer [(visible)]="mobileSidebar" position="left">
  <p-panelMenu [model]="menuItems"></p-panelMenu>
</p-drawer>
