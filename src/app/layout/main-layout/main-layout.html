<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #drawer
             [mode]="isMobile ? 'over' : 'side'"
             [opened]="!isMobile"
             [style.width.px]="isCollapsed ? 70 : 240"
             class="sidenav">

    <div class="logo-section">
      <div class="logo" *ngIf="!isCollapsed">ERP Pro</div>
      <button mat-icon-button (click)="toggleSidebar()" *ngIf="!isMobile">
        <mat-icon>{{ isCollapsed ? 'menu' : 'menu_open' }}</mat-icon>
      </button>
    </div>
   <mat-nav-list>

  <!-- Dashboard -->
  <a mat-list-item
     routerLink="/dashboard"
     routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }">
    <mat-icon>dashboard</mat-icon>
    <span class="menu-text" *ngIf="!isCollapsed">Dashboard</span>
  </a>

  <!-- ================= MASTER ================= -->

  <mat-expansion-panel hideToggle *ngIf="!isCollapsed" class="menu-group">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>folder</mat-icon>
        <span class="menu-text">Master</span>
      </mat-panel-title>
    </mat-expansion-panel-header>

    <a mat-list-item routerLink="/product" routerLinkActive="active">
      <mat-icon>inventory_2</mat-icon>
      <span>Products</span>
    </a>

    <a mat-list-item routerLink="/serviceType" routerLinkActive="active">
      <mat-icon>build</mat-icon>
      <span>Services</span>
    </a>

    <a mat-list-item routerLink="/bp" routerLinkActive="active">
      <mat-icon>business</mat-icon>
      <span>Business Partners</span>
    </a>
  </mat-expansion-panel>

  <!-- ================= TRANSACTIONS ================= -->

  <mat-expansion-panel hideToggle *ngIf="!isCollapsed" class="menu-group">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>swap_horiz</mat-icon>
        <span class="menu-text">Transactions</span>
      </mat-panel-title>
    </mat-expansion-panel-header>

    <a mat-list-item routerLink="/invoice" routerLinkActive="active">
      <mat-icon>receipt_long</mat-icon>
      <span>Invoices</span>
    </a>
  </mat-expansion-panel>

  <!-- ================= SETTINGS ================= -->

  <mat-expansion-panel hideToggle
                       *ngIf="!isCollapsed && user?.userRole === 'Admin'"
                       class="menu-group">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>settings</mat-icon>
        <span class="menu-text">Settings</span>
      </mat-panel-title>
    </mat-expansion-panel-header>

    <a mat-list-item routerLink="/users" routerLinkActive="active">
      <mat-icon>people</mat-icon>
      <span>Users</span>
    </a>
  </mat-expansion-panel>

</mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>

    <!-- TOP TOOLBAR -->
    <mat-toolbar color="primary" class="toolbar">

      <button *ngIf="isMobile" mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="app-title">ERP Management</span>

      <span class="spacer"></span>

      <!-- Dark Mode Toggle -->
      <button mat-icon-button (click)="themeService.toggleTheme()">
        <mat-icon>
          {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
        </mat-icon>
      </button>

      <!-- User Menu -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>

    </mat-toolbar>

    <!-- PAGE CONTENT -->
    <div class="content">
      <nav class="breadcrumb">
        <span>Home</span>
        <mat-icon>chevron_right</mat-icon>
        <span class="current">{{ currentRoute }}</span>
      </nav>
      <div>
        <router-outlet></router-outlet>
      </div>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
