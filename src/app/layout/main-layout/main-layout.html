<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" [class.collapsed]="isCollapsed">

    <div class="sidebar-header">
      <span class="logo" *ngIf="!isCollapsed">ERP Traveler</span>

      <button pButton
              icon="pi pi-bars"
              text
              (click)="toggleSidebar()">
      </button>
    </div>

    <p-panelMenu [model]="menuItems"
                 [style]="{ width: '100%' }"
                 class="erp-menu">
    </p-panelMenu>

  </div>


  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-left">
        <button *ngIf="isMobile"
                pButton
                icon="pi pi-bars"
                text
                (click)="mobileSidebar = true">
        </button>

        <span class="page-title">{{ currentRoute }}</span>
      </div>

      <div class="topbar-right">

        <!-- User Menu -->
        <p-menu #userMenu
                [popup]="true"
                [model]="userItems">
        </p-menu>

        <button pButton
                icon="pi pi-user"
                text
                (click)="userMenu.toggle($event)">
        </button>

      </div>

    </div>

    <!-- CONTENT -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>


<!-- MOBILE DRAWER -->
<p-drawer [(visible)]="mobileSidebar"
          position="left"
          [modal]="true">

  <p-panelMenu [model]="menuItems"></p-panelMenu>

</p-drawer>
