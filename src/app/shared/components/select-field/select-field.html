<div class="field flex flex-col gap-1">

<label>{{ label }}</label>

<p-select
  [options]="options"
  [optionLabel]="optionLabel"
  [optionValue]="optionValue"
  [formControlName]="controlName"
  [invalid]="control?.invalid && submitted"
  class="w-full">
</p-select>

<app-form-error
  [control]="control"
  [label]="label"
  [show]="submitted">
</app-form-error>

</div>
