<div class="field flex flex-col gap-1">

<label class="flex items-center gap-1">
    {{ label }}
    <span *ngIf="required" class="text-red-500">*</span>
  </label>

<p-inputNumber
  [formControlName]="controlName"
  [mode]="mode"
  [currency]="currency"
  [suffix]="suffix"
   [useGrouping]="false" 
  [invalid]="control?.invalid && submitted"
  class="w-full">
</p-inputNumber>

<app-form-error
  [control]="control"
  [label]="label"
  [show]="submitted">
</app-form-error>

</div>
