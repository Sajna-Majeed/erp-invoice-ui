<div class="field flex flex-col gap-1">

<label>{{ label }}</label>

<p-inputNumber
  [formControlName]="controlName"
  [mode]="mode"
  [currency]="currency"
  [suffix]="suffix"
  [invalid]="control?.invalid && submitted"
  class="w-full">
</p-inputNumber>

<app-form-error
  [control]="control"
  [label]="label"
  [show]="submitted">
</app-form-error>

</div>
