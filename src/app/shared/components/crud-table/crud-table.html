<div class="table-wrapper">

    <!-- Search -->
    <div class="table-header">
        <p-card>
            <p-toolbar>
                <ng-template #start>
                    <p-floatLabel variant="on">
                        <input pInputText id="search"
                            (input)="table.filterGlobal($any($event.target).value, 'contains')" autocomplete="off" />
                        <label for="search"> <i class="pi pi-search"></i> Search products...</label>
                    </p-floatLabel>
                </ng-template>
                <ng-template #end>
                    <p-splitbutton icon="pi pi-download" [model]="items" [rounded]="true" [text]="true"
                        [raised]="true" />
                </ng-template>

            </p-toolbar>


        </p-card>

    </div>

    <p-table #table [value]="data" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]"
        [globalFilterFields]="columns.map(c => c.field)" responsiveLayout="scroll" [scrollable]="true"
        scrollHeight="400px" [tableStyle]="{ 'min-width': '50rem' }" [size]="'small'" [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '50rem' }"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]">

        <!-- Header -->
        <ng-template pTemplate="header">

            <tr>
                <th *ngFor="let col of columns" pSortableColumn="{{col.field}}">

                    {{col.header}}

                    <p-sortIcon *ngIf="col.sortable !== false" [field]="col.field"></p-sortIcon>

                </th>
                <th style="width:140px">Actions</th>

            </tr>

        </ng-template>

        <!-- Body -->
        <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">

            <tr>

                <td *ngFor="let col of columns" [ngClass]="{'text-right': col.type === 'currency' ||
                col.type === 'number','text-center': col.type === 'status'||col.type === 'tax' }">
                    
                    <span *ngIf="col.type === 'rowId'">
                         {{ rowIndex + 1 }}
                    </span>
                  
                    <!-- TEXT -->
                    <span *ngIf="col.type === 'text'">
                        {{ row[col.field] }}
                    </span>

                    <!-- CURRENCY -->
                    <span *ngIf="col.type === 'currency'">
                        {{ row[col.field] | erpCurrency }}
                    </span>

                    <!-- NUMBER -->
                    <span *ngIf="col.type === 'number'">
                        {{ row[col.field] | erpNumber }}
                    </span>

                    <!-- NUMBER -->
                    <span *ngIf="col.type === 'tax'">
                        {{ (row[col.field])  }}
                    </span>
                    <!-- STATUS -->
                    <span *ngIf="col.type === 'status'">

                        <p-button *ngIf="row[col.field]" icon="pi pi-check" severity="success" size="small"
                            (click)="toggle.emit(row)">
                        </p-button>

                        <p-button *ngIf="!row[col.field]" icon="pi pi-times" severity="danger" size="small"
                            (click)="toggle.emit(row)">
                        </p-button>

                    </span>

                </td>

                <!-- Actions -->
                <td class="flex gap-2">

                    <button pButton icon="pi pi-pencil" text (click)="edit.emit(row)">
                    </button>

                    <button pButton icon="pi pi-trash" severity="danger" text (click)="delete.emit(row)">
                    </button>

                </td>

            </tr>

        </ng-template>

    </p-table>

</div>
