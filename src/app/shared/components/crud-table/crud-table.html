<p-table
    [value]="data"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5,10,20]"
    [responsiveLayout]="'scroll'">

    <!-- Header -->
    <ng-template pTemplate="header">
        <tr>
            <th *ngFor="let col of columns">
                {{ col.header }}
            </th>
            <th style="width:140px">Actions</th>
        </tr>
    </ng-template>

    <!-- Body -->
    <ng-template pTemplate="body" let-row>

        <tr>

            <td *ngFor="let col of columns">
                {{ row[col.field] }}
            </td>

            <td class="flex gap-2">

                <button
                    pButton
                    icon="pi pi-pencil"
                    text
                    (click)="edit.emit(row)">
                </button>

                <button
                    pButton
                    icon="pi pi-trash"
                    severity="danger"
                    text
                    (click)="delete.emit(row)">
                </button>

            </td>

        </tr>

    </ng-template>

</p-table>
