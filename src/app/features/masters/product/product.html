<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h2>Sub Category</h2>
    <div class="actions">
      <button pButton label="Add Sub Category" icon="pi pi-plus" class="p-button-primary"
        (click)="openCreate()"></button>
    </div>
  </div>

  <!-- Table -->
  <app-crud-table [data]="products" [fileName]="'Products'" [columns]="columns" [loading]="loading"
    (edit)="openEdit($event)" (delete)="delete($event.pd_Id)" (toggle)="toggleStatus($event.pd_Id)">
  </app-crud-table>
</div>
<!-- Dialog -->
<p-dialog header="{{ dialogTitle }}" [(visible)]="moduleDialog" [modal]="true" [style]="{ width: '500px' }">
  <p-progressSpinner *ngIf="isSaving" styleClass="dialog-spinner"> </p-progressSpinner>
  <form [formGroup]="form">
    <div class="form-grid">
      <div class="field">
        <label>Code</label>
        <input pInputText formControlName="code" />
      </div>
      <app-text-field label="Product" controlName="name" [required]="true" [submitted]="formSubmitted">
      </app-text-field>
      <app-select-field label="Category" controlName="cat_Id" [options]="categories" optionLabel="name" [required]="true"
        optionValue="cat_Id"  [submitted]="formSubmitted">
      </app-select-field>
      <div class="field">
        <app-text-area label="Description" controlName="description" [submitted]="formSubmitted">
        </app-text-area>
      </div>



    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" text (click)="hideDialog()"></button>
    <button pButton label="Save" icon="pi pi-check" [disabled]="form.invalid || form.pending || isSaving"
      [loading]="isSaving" (click)="saveModule()"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog> <p-toast></p-toast>
