<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h2>Customers</h2>
    <div class="actions">
      <button pButton label="Add Customer" icon="pi pi-plus" class="p-button-primary" (click)="openCreate()"></button>
    </div>
  </div>

  <!-- Table -->
  <app-crud-table [data]="customers" [fileName]="'Customers'" [columns]="columns" [loading]="loading"
    (edit)="openEdit($event)" (delete)="delete($event.customer_Id)" (toggle)="toggleStatus($event.customer_Id)">
  </app-crud-table>
</div>
<!-- Dialog -->
<p-dialog header="{{ dialogTitle }}" [(visible)]="customerDialog" [modal]="true" [style]="{ width: '500px' }">
  <p-progressSpinner *ngIf="isSaving" styleClass="dialog-spinner"> </p-progressSpinner>
  <form [formGroup]="form">
    <div class="form-grid">
      <div>
        <div class="field">
          <label>Code</label>
          <input pInputText formControlName="code" />
        </div>
        <app-text-field label="Customer Name" controlName="name" [required]="true" [submitted]="formSubmitted">
        </app-text-field>

        <div class="field">
          <app-text-area label="Description" controlName="description" [submitted]="formSubmitted">
          </app-text-area>
        </div>
        <app-select-field label="Customer Type" controlName="customer_Type_Id" [options]="customerTypes"
          optionLabel="name" [required]="true" optionValue="ct_Id" [submitted]="formSubmitted">
        </app-select-field>
      </div>
      <div>
        <app-text-field label="Contact Person" [required]="true" controlName="contact_Person"
          [submitted]="formSubmitted">
        </app-text-field>
        <app-text-field label="Email" [required]="true" controlName="email" [submitted]="formSubmitted">
        </app-text-field>
        <app-number-field label="Mobile Number" [required]="true" controlName="mobile_number" [submitted]="formSubmitted">
        </app-number-field>
        <app-text-field label="Address Line" [required]="true" controlName="addressLine1" [submitted]="formSubmitted">
        </app-text-field>
        <app-text-field label="City" [required]="true" controlName="city" [submitted]="formSubmitted">
        </app-text-field>
        <app-text-field [required]="true" label="Province" controlName="country_Subdivision"
          [submitted]="formSubmitted">
        </app-text-field>
        <app-text-field label="Country" [required]="true" controlName="country" [submitted]="formSubmitted">
        </app-text-field>
        <app-number-field [required]="true" label="Zip Code" controlName="zip_code" [submitted]="formSubmitted">
        </app-number-field>
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" text (click)="hideDialog()"></button>
    <button pButton label="Save" icon="pi pi-check" [disabled]="form.invalid || form.pending || isSaving"
      [loading]="isSaving" (click)="saveCustomerType()"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog> <p-toast></p-toast>
