<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h2>Custom Product Price</h2>
    <div class="actions">
      <button pButton label="Add Custom Product Price" icon="pi pi-plus" class="p-button-primary"
        (click)="openCreate()"></button>
    </div>
  </div>

  <!-- Table -->
  <app-crud-table [data]="custompricelist" [fileName]="'CustomePrice'" [columns]="columns" [loading]="loading"
    (edit)="openEdit($event)" (delete)="delete($event.custom_Prod_Id)" (toggle)="toggleStatus($event.custom_Prod_Id)">
  </app-crud-table>
</div>
<!-- Dialog -->
<p-dialog header="{{ dialogTitle }}" [(visible)]="customPriceDialog" [modal]="true" [style]="{ width: '500px' }">
  <p-progressSpinner *ngIf="isSaving" styleClass="dialog-spinner"> </p-progressSpinner>
  <form [formGroup]="form">
    <div class="form-grid">
      <div>
        <div class="field">
          <label>Code</label>
          <input pInputText formControlName="code" />
        </div>
        <app-select-field label="Customer" controlName="customer_Id" [options]="customers" optionLabel="name"
          optionValue="customer_Id" [submitted]="formSubmitted">
        </app-select-field>
        <app-select-field label="Service Type" controlName="st_Id" [options]="serviceType" optionLabel="name"
          optionValue="st_Id" [submitted]="formSubmitted">
        </app-select-field>
        <app-select-field label="Product" controlName="pd_Id" [options]="products" optionLabel="name"
          optionValue="prod_Id" [submitted]="formSubmitted">
        </app-select-field>
        <app-select-field label="Module" controlName="module_Id" [options]="modules" optionLabel="name"
          optionValue="module_Id" [submitted]="formSubmitted">
        </app-select-field>
        <app-number-field label="Unit Price" controlName="unit_Price" mode="currency" currency="INR"
          [submitted]="formSubmitted">
        </app-number-field>
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" text (click)="hideDialog()"></button>
    <button pButton label="Save" icon="pi pi-check" [disabled]="form.invalid || form.pending || isSaving"
      [loading]="isSaving" (click)="saveCustomerType()"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog> <p-toast></p-toast>
