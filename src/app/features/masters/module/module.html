<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h2>Sub Category</h2>
    <div class="actions">
      <button pButton label="Add Sub Category" icon="pi pi-plus" class="p-button-primary"
        (click)="openCreate()"></button>
    </div>
  </div>

  <!-- Table -->
  <app-crud-table [data]="modules" [fileName]="'Subcategory'" [columns]="columns" [loading]="loading"
    (edit)="openEdit($event)" (delete)="delete($event.lt_Id)" (toggle)="toggleStatus($event.lt_Id)">
  </app-crud-table>
</div>
<!-- Dialog -->
<p-dialog header="{{ dialogTitle }}" [(visible)]="moduleDialog" [modal]="true" [style]="{ width: '500px' }">
  <p-progressSpinner *ngIf="isSaving" styleClass="dialog-spinner"> </p-progressSpinner>
  <form [formGroup]="form">
    <div class="form-grid">
      <div class="field">
        <label>Code</label>
        <input pInputText formControlName="code" />
      </div>
      <app-text-field label="Subcategory" controlName="name" [required]="true" [submitted]="formSubmitted">
      </app-text-field>
      <app-select-field label="Category" controlName="pd_Id" [options]="products" optionLabel="name" [required]="true"
        optionValue="pd_Id" (selectionChange)="onProductSelected($event)" [submitted]="formSubmitted">
      </app-select-field>
      <div class="field">
        <app-text-area label="Description" controlName="description" [submitted]="formSubmitted">
        </app-text-area>
        @if(isALF){
        <app-number-field label="Subscription Rate" [required]="true" mode="decimal" controlName="s_Rate"
          [submitted]="formSubmitted">
        </app-number-field>
        <app-number-field label="Perpetual Rate" [required]="true" mode="decimal" controlName="p_Rate"
          [submitted]="formSubmitted">
        </app-number-field>
        <app-number-field label="Renewal Percentage" [required]="true" mode="decimal" controlName="alf_Rate" suffix="%"
          [submitted]="formSubmitted">
        </app-number-field>
        }
        @if(!isALF){
        <app-number-field label="Unit Rate" [required]="true" mode="decimal" controlName="unit_Rate"
          [submitted]="formSubmitted">
        </app-number-field>
        }

      </div>



    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" text (click)="hideDialog()"></button>
    <button pButton label="Save" icon="pi pi-check" [disabled]="form.invalid || form.pending || isSaving"
      [loading]="isSaving" (click)="saveModule()"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog> <p-toast></p-toast>
