<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h2>Category</h2>
    <div class="actions">
      <button pButton label="Add Category" icon="pi pi-plus" class="p-button-primary" (click)="openCreate()"></button>
    </div>
  </div>

  <!-- Table -->
  <app-crud-table [data]="category" [fileName]="'Categories'" [columns]="columns" [loading]="loading"
    (edit)="openEdit($event)" (delete)="delete($event.cat_Id)" (toggle)="toggleStatus($event.cat_Id)">
  </app-crud-table>
</div>
<!-- Dialog -->
<p-dialog header="{{ dialogTitle }}" [(visible)]="categoryDialog" [modal]="true" [style]="{ width: '500px' }">
  <p-progressSpinner *ngIf="isSaving" styleClass="dialog-spinner"> </p-progressSpinner>
  <form [formGroup]="form">
    <div class="form-grid">
      <div class="field">
        <label>Code</label>
        <input pInputText formControlName="code" />
      </div>
      <app-text-field label="Category" controlName="name" [required]="true" [submitted]="formSubmitted">
      </app-text-field>

      <div class="field">
        <app-text-area label="Description" controlName="description" [submitted]="formSubmitted">
        </app-text-area>
      </div>
      <app-select-field label="Service Type" [required]="true" controlName="st_Id" [options]="servicetypes" optionLabel="name"
        optionValue="st_Id" [submitted]="formSubmitted">
      </app-select-field>

    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" text (click)="hideDialog()"></button>
    <button pButton label="Save" icon="pi pi-check" [disabled]="form.invalid || form.pending || isSaving"
      [loading]="isSaving" (click)="saveProduct()"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog> <p-toast></p-toast>
