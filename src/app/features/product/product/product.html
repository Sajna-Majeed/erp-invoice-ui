  <div class="page-header">
    <h2>Products</h2>

        pButton
        label="Add Product"
        icon="pi pi-plus"
        class="p-button-primary"
        (click)="openCreate()"
      ></button>
    </div>
  </div>

  <!-- Table -->
  <p-card>
    <app-crud-table
      [data]="products"
      [columns]="columns"
      (edit)="openEdit($event)"
      (delete)="delete($event)"
      (toggle)="toggleStatus($event)"
    >
    </app-crud-table>
  </p-card>
</div>
<!-- Dialog -->
<p-dialog
  header="{{ dialogTitle }}"
  [(visible)]="productDialog"
  [modal]="true"
  [style]="{ width: '500px' }"
>
  <p-progressSpinner *ngIf="isSaving" styleClass="dialog-spinner"> </p-progressSpinner>
  <form [formGroup]="form">
    <div class="form-grid">
      <div class="field">
        <label>Code</label>
        <input pInputText formControlName="code" />
      </div>
      <app-text-field
        label="Product Name"
        controlName="name"
        [form]="form"
        [submitted]="formSubmitted"
      >
      </app-text-field>

      <div class="field">
        <label>Description</label> <input pInputText formControlName="description" />
      </div>
      <app-select-field
        label="UOM"
        controlName="uom_Id"
        [options]="uoms"
        optionLabel="code"
        optionValue="uom_Id"
        [form]="form"
        [submitted]="formSubmitted"
      >
      </app-select-field>

      <app-number-field
        label="Unit Price"
        controlName="unit_Price"
        mode="currency"
        currency="INR"
        [form]="form"
        [submitted]="formSubmitted"
      >
      </app-number-field>

      <app-number-field
        label="Tax Rate"
        controlName="tax_Rate"
        suffix="%"
        [form]="form"
        [submitted]="formSubmitted"
      >
      </app-number-field>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" text (click)="hideDialog()"></button>
    <button
      pButton
      label="Save"
      icon="pi pi-check"
      [disabled]="form.invalid || isSaving"
      [loading]="isSaving"
      (click)="saveProduct()"
    ></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog> <p-toast></p-toast>
